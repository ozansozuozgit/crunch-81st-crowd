name: Analyze crowd insights

on:
  schedule:
    - cron: "23 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crunch-81st-data-writer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -v
      - name: Analyze public readings
        run: python scripts/analyze.py
      - name: Commit changed insights
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data/insights.json
          git diff --cached --quiet || {
            git commit -m "data: refresh crowd insights"
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              sleep "$attempt"
            done
            echo "Failed to push crowd insights after three attempts." >&2
            exit 1
          }
