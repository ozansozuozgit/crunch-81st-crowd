name: Analyze crowd insights

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install schedule parser
        run: python -m pip install --requirement requirements.txt
      - name: Test
        run: python -m unittest discover -v
      - name: Refresh public class schedule and analyze readings
        run: |
          python scripts/sync_classes.py
          python scripts/analyze.py
      - name: Commit changed crowd context
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data/classes.csv docs/data/classes_meta.json docs/data/insights.json
          git diff --cached --quiet || {
            git commit -m "data: refresh crowd context"
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              if git rebase "origin/${GITHUB_REF_NAME}"; then
                :
              else
                conflicted_files="$(git diff --name-only --diff-filter=U)"
                unexpected_files="$(printf '%s\n' "$conflicted_files" | grep -Fvx \
                  -e docs/data/classes.csv \
                  -e docs/data/classes_meta.json \
                  -e docs/data/insights.json || true)"
                if [ -n "$conflicted_files" ] && [ -z "$unexpected_files" ]; then
                  # The upstream generated context is the newer successful run.
                  # Retain it as one coherent schedule/insights snapshot.
                  git checkout --ours -- docs/data/classes.csv docs/data/classes_meta.json docs/data/insights.json
                  git add -- docs/data/classes.csv docs/data/classes_meta.json docs/data/insights.json
                  GIT_EDITOR=true git rebase --continue
                else
                  echo "Unexpected rebase conflict: ${conflicted_files:-none}" >&2
                  exit 1
                fi
              fi
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              sleep "$attempt"
            done
            echo "Failed to push crowd insights after three attempts." >&2
            exit 1
          }
