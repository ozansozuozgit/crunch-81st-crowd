name: Collect Crunch occupancy

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -v
      - name: Collect public occupancy reading
        run: python scripts/collector.py
      - name: Commit a changed reading
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data/readings.csv
          git diff --cached --quiet || {
            git commit -m "data: record Crunch occupancy"
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              if git rebase "origin/${GITHUB_REF_NAME}"; then
                :
              else
                conflicted_files="$(git diff --name-only --diff-filter=U)"
                if [ "$conflicted_files" = "docs/data/readings.csv" ]; then
                  python scripts/merge_readings.py docs/data/readings.csv
                  git add -- docs/data/readings.csv
                  GIT_EDITOR=true git rebase --continue
                else
                  echo "Unexpected rebase conflict: ${conflicted_files:-none}" >&2
                  exit 1
                fi
              fi
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              sleep "$attempt"
            done
            echo "Failed to push Crunch occupancy after three attempts." >&2
            exit 1
          }
